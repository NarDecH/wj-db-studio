name: CI

# Sanity checks on every push/PR: syntax-check all JS, boot selftest on Electron.
# (c) 2026 Weeradech Jessadarom — MIT

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install --no-audit --no-fund

      - name: Syntax-check all JS files
        run: |
          find main src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Electron selftest (headless boot)
        run: |
          xvfb-run -a npm run selftest || xvfb-run -a npx electron . --selftest
        continue-on-error: false
